[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repoready"
version = "0.1.0"
description = "Verify whether an open-source repository is ready for new contributors."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "RepoReady contributors"}]
keywords = ["github", "open-source", "developer-tools", "documentation", "onboarding", "cli"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License"]

[project.scripts]
repoready = "repoready.cli:main"

[tool.setuptools.packages.find]
include = ["repoready*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
